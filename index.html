
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISLΞX AI | ربط واتساب</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #080b12;
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px;
}
.card {
  width: 100%;
  max-width: 420px;
  padding: 30px 22px;
  border: 1px solid #263246;
  border-radius: 18px;
  background: #101725;
  text-align: center;
}
h1 { letter-spacing: 2px; }
p { color: #aab6c8; line-height: 1.8; }
.status {
  display: inline-block;
  padding: 8px 14px;
  border-radius: 20px;
  background: #1b2b25;
  color: #75e0a1;
}
</style>
</head>
<body>
<main class="card">
  <h1>ISLΞX AI</h1>
  <p>نظام ربط واتساب</p>
  <p>الموقع جاهز للتجهيز لاستقبال طلبات ربط الأجهزة.</p>
  <span class="status">الموقع متاح</span>
</main>
</body>
</html>
